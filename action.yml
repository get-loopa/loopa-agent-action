name: Loopa repository analysis runtime
description: Executes one phase of a frozen administrator-created Loopa analysis run.
author: Loopa
branding:
  icon: book-open
  color: purple
inputs:
  mode:
    description: prepare, extract, or synthesize.
    required: true
  workspace-id:
    description: Legacy Loopa workspace identifier. New callers use request-id only.
    required: false
  request-id:
    description: Required administrator-created Loopa run request.
    required: true
  connection-id:
    description: Source connection identifier for extract mode.
    required: false
  source-root:
    description: Checked-out source repository directory.
    required: false
    default: source
  source-repository:
    description: Expected owner/name for extract mode.
    required: false
  source-repository-id:
    description: Exact GitHub repository ID resolved with the reader token.
    required: false
  capsules-path:
    description: Downloaded signed capsule directory.
    required: false
    default: capsules
  loopa-api-url:
    description: Loopa API base URL.
    required: false
    default: https://api.getloopa.co
outputs:
  report-id:
    description: Identifier assigned by Loopa to the accepted report.
  proposal-count:
    description: Number of proposals delivered.
  status:
    description: Phase status.
  source-matrix:
    description: Frozen JSON source matrix.
  capsule-path:
    description: Signed source capsule path.
  request-id:
    description: Administrator-created run request.
runs:
  using: node24
  main: dist/index.js
