name: Loopa repository analysis
description: Analyze repository changes using your Loopa organization AI settings.
author: Loopa
branding:
  icon: book-open
  color: purple
inputs:
  connection-id:
    description: Non-secret connection identifier generated by Loopa.
    required: true
  provider:
    description: Legacy direct-provider mode only.
    required: false
  model:
    description: Legacy direct-provider mode only.
    required: false
  llm-api-key:
    description: Legacy direct-provider mode only. New setups use a short-lived Loopa token.
    required: false
  config-path:
    description: Path to the Loopa analysis configuration.
    required: false
    default: .github/loopa.yml
  base-url:
    description: Base URL for a custom OpenAI-compatible provider. OpenCode Go always uses its official fixed endpoint.
    required: false
  azure-endpoint:
    description: Azure OpenAI endpoint, for example https://resource.openai.azure.com.
    required: false
  azure-api-version:
    description: Azure OpenAI API version.
    required: false
  loopa-api-url:
    description: Advanced Loopa API base URL override.
    required: false
    default: https://api.getloopa.co
outputs:
  report-id:
    description: Identifier assigned by Loopa to the accepted report.
  proposal-count:
    description: Number of proposals delivered.
  status:
    description: Delivery status.
runs:
  using: node24
  main: dist/index.js
